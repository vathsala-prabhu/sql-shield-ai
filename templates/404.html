{% extends "base.html" %}
{% block title %}Page Not Found - SQL SHIELD AI{% endblock %}
{% block breadcrumb %}Error{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 60px 20px; max-width: 600px; margin: 40px auto;">
  <div style="font-size: 48px; margin-bottom: 16px;">🔍</div>
  <h2 style="font-size: 24px; color: #fff; margin-bottom: 8px;">Resource Not Found</h2>
  <p style="color: var(--text-secondary); margin-bottom: 24px;">{{ message or "The page or incident record you are looking for does not exist." }}</p>
  <a href="/" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
